# Checks every card pull request and merges the good ones.
# pull_request_target runs THIS repo's code from main, with permission to comment.
# It never checks out or runs anything from the pull request: it reads the card's
# text through the API (see scripts/check-pr.cjs).
name: wall-check
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
permissions: {}
concurrency:
  group: wall-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      sha: ${{ steps.check.outputs.sha }}
      handle: ${{ steps.check.outputs.handle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (main only, never the PR)
        with:
          persist-credentials: false
      - id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WALL_AUTOMERGE: ${{ vars.WALL_AUTOMERGE }}
        with:
          script: return await require(process.env.GITHUB_WORKSPACE + '/scripts/check-pr.cjs')({ github, context, core })
  merge:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (main only, for the config file)
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECKED_SHA: ${{ needs.check.outputs.sha }}
          HANDLE: ${{ needs.check.outputs.handle }}
        with:
          script: return await require(process.env.GITHUB_WORKSPACE + '/scripts/merge-pr.cjs')({ github, context, core })
